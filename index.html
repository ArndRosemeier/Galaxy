<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060a" />
    <title>Galaxy — a procedural atlas</title>
    <meta
      name="description"
      content="A procedural galaxy creator: spiral arms, stars, systems, planets, moons, rings and belts — generated from a seed, explorable down to a single world."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2305060a'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23ffd27a'/%3E%3Cellipse cx='16' cy='16' rx='11' ry='4.2' fill='none' stroke='%237aa2ff' stroke-width='1.6' transform='rotate(-24 16 16)'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app">
      <canvas id="scene" aria-label="Galaxy view" role="img"></canvas>
      <div id="ui" class="ui" aria-live="polite"></div>
      <div id="boot" class="boot" aria-hidden="true">
        <div class="boot__mark">
          <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
            <circle cx="32" cy="32" r="5" fill="currentColor" />
            <ellipse
              cx="32"
              cy="32"
              rx="26"
              ry="9"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              opacity=".55"
              transform="rotate(-24 32 32)"
            />
          </svg>
        </div>
        <p class="boot__text">charting the disc…</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
