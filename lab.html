<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#05060a" />
    <title>Galaxy — render lab</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        color-scheme: dark;
        --ink: #dfe6f2;
        --dim: #8494ad;
        --edge: rgba(148, 176, 220, 0.25);
        --panel: rgba(8, 12, 20, 0.62);
        --accent: #8fc7ff;
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05060a;
        color: var(--ink);
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      }
      #scene {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
        cursor: grab;
        outline: none;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 10;
        pointer-events: none;
        padding: 9px 11px 10px;
        border: 1px solid var(--edge);
        border-radius: 9px;
        background: var(--panel);
        backdrop-filter: blur(8px);
        min-width: 250px;
        max-width: calc(100vw - 24px);
        user-select: none;
      }
      #hud .title {
        display: flex;
        align-items: baseline;
        gap: 8px;
        letter-spacing: 0.16em;
        font-size: 10px;
        color: var(--dim);
        text-transform: uppercase;
      }
      #hud .title b {
        color: var(--accent);
        font-weight: 600;
        letter-spacing: 0.2em;
      }
      #hud-view {
        color: var(--ink);
        font-size: 13px;
        letter-spacing: 0.22em;
      }
      #hud-stats { margin-top: 5px; color: #c9d6e8; font-variant-numeric: tabular-nums; }
      #hud-budget { color: var(--dim); font-size: 10.5px; }
      #hud-target { color: var(--dim); font-size: 10.5px; margin-top: 2px; }
      #hud-time { color: var(--dim); font-size: 10.5px; }
      #hint {
        position: fixed;
        bottom: 12px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        pointer-events: none;
        color: var(--dim);
        font-size: 10.5px;
        letter-spacing: 0.04em;
        background: var(--panel);
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 6px 13px;
        max-width: calc(100vw - 20px);
        white-space: normal;
        text-align: center;
        line-height: 1.35;
        backdrop-filter: blur(8px);
      }
      #error {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 20;
        max-width: min(640px, calc(100vw - 32px));
        padding: 14px 16px;
        border: 1px solid #ff7f6b;
        border-radius: 10px;
        background: rgba(40, 8, 6, 0.94);
        color: #ffd9d2;
        white-space: pre-wrap;
      }
      @media (max-width: 520px) {
        #hud { top: 8px; left: 8px; min-width: 0; padding: 7px 9px; }
        #hint { bottom: 8px; font-size: 9.5px; padding: 5px 10px; }
      }
    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="Galaxy render laboratory" role="img"></canvas>
    <div id="hud">
      <div class="title"><b>Galaxy</b><span>render lab · fixture</span></div>
      <div id="hud-view">GALAXY</div>
      <div id="hud-stats">— draws · — tris · — pts</div>
      <div id="hud-budget">budget —</div>
      <div id="hud-target">target —</div>
      <div id="hud-time">t+17.3 d · paused</div>
    </div>
    <div id="hint">drag to orbit · wheel to zoom · click to select · keys 1 / 2 / 3</div>
    <pre id="error" hidden></pre>
    <script type="module" src="/src/render/lab/lab.ts"></script>
  </body>
</html>
